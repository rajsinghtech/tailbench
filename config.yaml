# tailbench configuration
# Secrets are loaded from env_file, referenced via ${VAR} syntax

env_file: .env  # sources OAUTH_CLIENT_ID, OAUTH_CLIENT_SECRET

# Empty selects the provider compiled into the executable. A non-empty value
# must match that executable (aws, eks, azure, aks, gcp, or gke).
providers: []
family: all
filter: ""

# Pulumi state backend. Empty keeps state on this machine under ./state/<provider>,
# which means stacks are invisible from any other checkout or host.
#
#   pulumi.com              Pulumi Cloud — stacks survive machine swaps. Needs
#                           PULUMI_ACCESS_TOKEN (put it in .env) or `pulumi login`.
#   s3://bucket/prefix      Object storage; also gs:// and azblob://.
#
# Overridable with --state-backend, and ${VAR} is expanded here.
state_backend: ""

tailscale:
  create_tailnet: true
  oauth_client_id: ${OAUTH_CLIENT_ID}
  oauth_client_secret: ${OAUTH_CLIENT_SECRET}
  tag: tag:bench

benchmark:
  iperf_duration: 30
  iperf_parallel: 4
  iperf_iterations: 3
  mtr_cycles: 100
  cooldown_sec: 30
  fortio_duration: 30
  fortio_connections: 16
  fortio_qps: 0
  fortio_iterations: 3
  # Usable forwarding-pps sweep (forward-pps-exit mode). Optional overrides;
  # defaults are datagram sizes 64/340/1400 B, 0.1% loss threshold, 15s/step,
  # and a 2,000,000 pps ceiling on the offered-rate search.
  pps_datagram_sizes: [64, 340, 1400]
  pps_loss_threshold_pct: 0.1
  pps_duration_sec: 15
  pps_max_rate_pps: 2000000
  modes:
    - l4-kernel
    - l7-serve-h1
    - l7-serve-h2
    # - forward-pps-exit   # 3-node exit-node forwarding pps (VM only); opt-in
    # - relay-throughput   # 3-node peer-relay benchmark (VM only, Tailscale >= 1.86); opt-in
    # Container-only A/B pair: egress ProxyGroup forwarding pps with
    # TS_EXPERIMENTAL_ENABLE_FORWARDING_OPTIMIZATIONS off/on. Requires the
    # Tailscale Kubernetes operator; rejected by VM binaries.
    # - forward-pps-exit-k8s
    # - forward-pps-exit-k8s-opton

ssh:
  timeout: 120
  ready_timeout: 300

aws:
  region: us-west-2
  az: us-west-2a
  key_name: raj_macbook

gcp:
  project: tailscale-sandbox
  zone: us-central1-a

azure:
  location: eastus
  resource_group: tailbench-rg

images:
  bench: ghcr.io/rajsinghtech/tailbench-tools:latest
  tailscale: ghcr.io/tailscale/tailscale:latest

cleanup_networking: false
dry_run: false

l7_endpoints:
  ingress_fqdn: ""
  serve_fqdn: ""
  cluster_label: "app.kubernetes.io/part-of=tailbench-l7"
