name: Build and Push Containers

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docker/**'
      - 'cmd/**'
      - 'internal/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./website
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: type=gha,scope=website
          cache-to: type=gha,mode=max,scope=website
          tags: |
            ghcr.io/${{ github.repository_owner }}/tailbench:latest
            ghcr.io/${{ github.repository_owner }}/tailbench:${{ github.sha }}

  tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ./docker/tailbench-tools
          platforms: linux/amd64,linux/arm64
          push: true
          cache-from: |
            type=gha,scope=tools
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/tailbench-tools:buildcache
          cache-to: |
            type=gha,mode=max,scope=tools
            type=registry,ref=ghcr.io/${{ github.repository_owner }}/tailbench-tools:buildcache,mode=max
          tags: |
            ghcr.io/${{ github.repository_owner }}/tailbench-tools:latest
            ghcr.io/${{ github.repository_owner }}/tailbench-tools:${{ github.sha }}
