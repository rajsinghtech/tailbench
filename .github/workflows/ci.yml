name: Provider variants

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - run: make fmt

  variant:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {name: aws, tags: aws, binary: tailbench-aws, make_suffix: aws}
          - {name: aws-k8s, tags: 'aws,k8s', binary: tailbench-aws-k8s, make_suffix: aws-k8s}
          - {name: azure, tags: azure, binary: tailbench-azure, make_suffix: azure}
          - {name: azure-k8s, tags: 'azure,k8s', binary: tailbench-azure-k8s, make_suffix: azure-k8s}
          - {name: gcp, tags: gcp, binary: tailbench-gcp, make_suffix: gcp}
          - {name: gcp-k8s, tags: 'gcp,k8s', binary: tailbench-gcp-k8s, make_suffix: gcp-k8s}
    steps:
      - uses: actions/checkout@v4
      - id: go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ matrix.name }}-${{ hashFiles('go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-${{ matrix.name }}-
            go-${{ runner.os }}-${{ steps.go.outputs.go-version }}-
      - name: Cache lint tool
        uses: actions/cache@v4
        with:
          path: .tools
          key: golangci-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('go.sum', 'Makefile', '.golangci.yml') }}
      - run: make lint-${{ matrix.make_suffix }}
      - run: make test-${{ matrix.make_suffix }} GO_TEST_FLAGS=-p=1
      - run: make verify-deps VARIANT=${{ matrix.name }}
      - run: make build-${{ matrix.make_suffix }}
      - name: Inspect binary
        run: |
          ./scripts/verify-binary.sh ${{ matrix.name }} dist/${{ matrix.binary }}
          go version -m dist/${{ matrix.binary }}
          ls -lh dist/${{ matrix.binary }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}-${{ runner.os }}-${{ runner.arch }}
          path: dist/${{ matrix.binary }}
